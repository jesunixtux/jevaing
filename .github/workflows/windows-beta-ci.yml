name: Windows beta build and smoke tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure engine and editor
        run: cmake -S . -B build -DJEVAING_BUILD_C_SAMPLE=ON -DJEVAING_BUILD_EDITOR=ON -DJEVAING_BUILD_XBOX_SMOKE_TEST=OFF -DJEVAING_ENABLE_NATIVE_MODULES=ON
      - name: Compile engine, editor and sandbox
        run: cmake --build build --config ${{ matrix.configuration }} --target JevaingSandbox JevaingEditor JevaingCSample JevaingModuleSmokeTest
      - name: Run headless engine tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tests = @(
            "--self-test",
            "--project-template-test",
            "--scene-serialization-test",
            "--editor-scene-roundtrip-test",
            "--playmode-restore-test",
            "--physics-info",
            "--physics-2d-test",
            "--physics-3d-test",
            "--xbox-build-environment-test"
          )
          foreach ($test in $tests) {
            & .\bin\${{ matrix.configuration }}\JevaingSandbox.exe $test
            if ($LASTEXITCODE -ne 0) { throw "FAILED: $test" }
          }
          & .\bin\${{ matrix.configuration }}\JevaingEditor.exe --editor-info
          if ($LASTEXITCODE -ne 0) { throw "Editor info smoke failed" }
      - name: Validate pure C game ABI
        shell: pwsh
        run: |
          & .\build\bin\${{ matrix.configuration }}\JevaingCSample.exe --abi-test
          if ($LASTEXITCODE -ne 0) { throw "C ABI test failed" }
          $scenePath = Join-Path $env:RUNNER_TEMP ("jevaing-c-" + [guid]::NewGuid().ToString("N") + ".scene")
          & .\build\bin\${{ matrix.configuration }}\JevaingCSample.exe --scene-roundtrip-test $scenePath
          if ($LASTEXITCODE -ne 0) { throw "C scene roundtrip failed" }
          & .\build\bin\${{ matrix.configuration }}\JevaingCSample.exe --runtime-test --renderer null --frames 2
          if ($LASTEXITCODE -ne 0) { throw "C game lifecycle failed" }
          & .\build\bin\${{ matrix.configuration }}\JevaingCSample.exe --physics-test
          if ($LASTEXITCODE -ne 0) { throw "C physics test failed" }
          & .\build\bin\${{ matrix.configuration }}\JevaingCSample.exe --asset-test geometry/texture/base.png
          if ($LASTEXITCODE -ne 0) { throw "C texture test failed" }
      - name: Verify generated game build
        shell: pwsh
        run: |
          & .\bin\${{ matrix.configuration }}\JevaingSandbox.exe --windows-build-test
          if ($LASTEXITCODE -ne 0) { throw "Windows game export test failed" }
      - name: Verify optional native modules
        shell: pwsh
        run: |
          $moduleDir = ".\build\Samples\NativeModule\bin\${{ matrix.configuration }}"
          & "$moduleDir\JevaingModuleSmokeTest.exe" "$moduleDir\SmokeModule.jevmod"
          if ($LASTEXITCODE -ne 0) { throw "Native module test failed" }
